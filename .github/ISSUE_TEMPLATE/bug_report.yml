name: Bug report
description: Something in catchup does not work as the README says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste real session text, names, tokens or private data.** The mod reads your conversations, so
        a report can leak them. Replace anything private with made-up text, and keep only what shows the problem.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, and what did you see?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to repeat it
      description: Made-up text only. A short example that shows the problem is best.
  - type: input
    id: version
    attributes:
      label: catchup version
      description: The `version` in `.claude-plugin/plugin.json`, or `claude plugin list`.
    validations:
      required: true
  - type: input
    id: claude-code
    attributes:
      label: Claude Code version
      description: Run `claude --version`.
  - type: dropdown
    id: surface
    attributes:
      label: Where you saw it
      options: [Terminal, Desktop app, VS Code, Other]
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private text, names, tokens and file paths from everything I pasted.
          required: true
