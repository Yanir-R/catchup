# Settings for the automatic PR review (Qodo Merge / PR-Agent).
# Lean on purpose: one review and a few suggestions, no description rewrite, no labels.
# The rules below fit any Claude Code mod. A person reviews and merges; this is a second reader, not a gate.

[config]
response_language = "en-US"

[github_app]
pr_commands = ["/review", "/improve"]
handle_pr_actions = ["opened", "reopened", "ready_for_review"]
feedback_on_draft_pr = false

[pr_reviewer]
num_max_findings = 5
require_security_review = true
require_tests_review = true
require_estimate_effort_to_review = false
require_can_be_split_review = false
require_todo_scan = false
enable_review_labels_effort = false
enable_review_labels_security = false
extra_instructions = """
This repository is a Claude Code mod (a plugin made of function hooks). Report only real problems, each with a file and a line. Check these:
1. Capabilities. List the capability calls the change adds (the validate report shows them on its calls line). Flag any call to the file, process, network, environment, settings, store, state or MCP capabilities, or to prompt submit or session send, unless the PR says why. The release gate fails on the first six.
2. Hooks. Flag a new hook on tool.call, tool.check, prompt.submit or session.append, because it sees every call or prompt. Each hook must be listed in the README. A hook that does not handle an event must return next(e).
3. The $ rules. Call $.noun.method(...) plainly. Pass $ only as a whole argument to a function declared at the top level of the same file, never to an imported function, and never inside the arguments of another $ call. Avoid generic names such as run that another function shadows.
4. State. A render hook must not write state. After any write to in-memory data, call $.ui.invalidate('ui.render'). New data must be cleared on /clear, /resume and /branch.
5. Privacy. Text from messages must not reach a file, the network, a log or a test. Secrets and emails are removed before a model call. Tests use made-up data only.
6. Output. A claim of success needs a proof and a source, or it is shown as not checked. Facts that code can read come from code, not from the model.
7. Compatibility. Do not rename the command, a setting or the plugin name. A phrase trigger must match the whole prompt.
8. Tests. A new rule needs a test that fails when the code is wrong. Flag a test that cannot fail.
9. Release. The version, CHANGELOG and README match the change (Semantic Versioning).
Do not comment on style or naming that the tests and the scan do not require.
"""

[pr_code_suggestions]
num_code_suggestions_per_chunk = 3
focus_only_on_problems = true
suggestions_score_threshold = 6
extra_instructions = """
Suggest only a change that fixes a bug, a privacy leak, a broken $ rule, or a missing test. Keep the code short and match the style around it.
"""

[ignore]
glob = ['docs/media/**', '*.png', '*.gif', '*.mp4']
